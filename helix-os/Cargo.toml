[package]
name = "helix-os"
version = "0.1.0"
edition = "2021"
authors = ["Akshat Kumar Jha"]
description = "HelixOS — A baremetal x86_64 performance operating system"

[dependencies]
bootloader = "0.9.29"
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.14"
uart_16550 = "0.2.0"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.9.0"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

# Custom test framework (runs tests inside QEMU)
[[test]]
name = "basic_boot"
harness = false

[[test]]
name = "should_panic"
harness = false

[package.metadata.bootimage]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none"
]
test-success-exit-code = 33
